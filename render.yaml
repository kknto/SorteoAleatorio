services:
  - type: web
    name: sorteo-aleatorio
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sorteo-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: sorteo-db
    plan: free
    databaseName: sorteo
    user: sorteo_user
