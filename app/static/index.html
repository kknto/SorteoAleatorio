<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SorteoAleatorio — Plataforma Interactiva de Intercambio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/styles.css" />
</head>
<body>
  <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand" data-link>
        <span class="brand-icon" aria-hidden="true">🎁</span>
        <span class="brand-text">Sorteo<strong>Aleatorio</strong></span>
      </a>
    </div>

  <main id="app" class="app-container">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Cargando plataforma...</p>
    </div>
  </main>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/static/js/app.js"></script>

</html>
